name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Wizard smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the declared minimum and the latest release of the current LTS line
        node: ['24.15.0', '24']
    steps:
      - name: Get latest code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run smoke tests
        run: yarn test
